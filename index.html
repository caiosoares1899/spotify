<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PlaylistAI">
<meta name="theme-color" content="#0a0a0a">
<title>PlaylistAI — Crie playlists com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --green: #1DB954;
    --green-dim: rgba(29,185,84,0.12);
    --green-glow: rgba(29,185,84,0.3);
    --text: #f5f5f5;
    --muted: #888;
    --muted2: #555;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  /* APP SHELL */
  .app-header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(10,10,10,0.92); backdrop-filter:blur(12px); z-index:10; }
  .header-logo { font-family:'Syne',sans-serif; font-size:1.15rem; font-weight:800; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; }
  .header-logo span { color:var(--green); }
  .header-badge { font-size:0.7rem; padding:3px 10px; background:var(--green-dim); border:1px solid rgba(29,185,84,0.3); border-radius:999px; color:var(--green); }

  .app-body { display:flex; flex-direction:column; gap:1rem; padding:1.25rem; max-width:640px; margin:0 auto; width:100%; min-height:calc(100vh - 61px); }

  /* CHAT */
  .chat-area { flex:1; display:flex; flex-direction:column; gap:0.75rem; min-height:200px; }

  .msg { display:flex; gap:10px; animation:fadeUp 0.3s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
  .msg.user { flex-direction:row-reverse; }
  .msg-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; }
  .msg.agent .msg-avatar { background:var(--green); color:#000; }
  .msg.user .msg-avatar { background:var(--surface2); color:var(--muted); border:1px solid var(--border2); }
  .msg-bubble { max-width:85%; padding:0.75rem 1rem; border-radius:16px; font-size:0.88rem; line-height:1.6; }
  .msg.agent .msg-bubble { background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg.user .msg-bubble { background:var(--green-dim); border:1px solid rgba(29,185,84,0.25); border-bottom-right-radius:4px; }
  .msg-bubble strong { color:var(--green); font-weight:500; }

  /* PLAYLIST CARD */
  .playlist-card { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius-sm); margin-top:0.85rem; overflow:hidden; }

  .playlist-card-header { padding:0.85rem 1rem; border-bottom:1px solid var(--border); }
  .playlist-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:0.6rem; }
  .playlist-card-title { font-family:'Syne',sans-serif; font-size:0.95rem; font-weight:700; line-height:1.3; }
  .track-count-badge { font-size:0.7rem; padding:2px 8px; background:var(--green-dim); border:1px solid rgba(29,185,84,0.25); border-radius:999px; color:var(--green); white-space:nowrap; flex-shrink:0; margin-top:2px; }

  .playlist-actions { display:flex; gap:6px; }
  .btn-sp { display:inline-flex; align-items:center; gap:5px; font-size:0.75rem; font-weight:700; font-family:'Syne',sans-serif; padding:6px 12px; border-radius:999px; border:none; cursor:pointer; transition:all 0.18s; text-decoration:none; }
  .btn-sp-primary { background:var(--green); color:#000; }
  .btn-sp-primary:hover { background:#1ed760; transform:translateY(-1px); }
  .btn-sp-ghost { background:transparent; border:1px solid var(--border2); color:var(--muted); }
  .btn-sp-ghost:hover { border-color:var(--green); color:var(--green); }

  /* TRACK LIST */
  .playlist-track-list { display:flex; flex-direction:column; }
  .pl-track { display:grid; grid-template-columns:24px 1fr auto; align-items:center; gap:10px; padding:0.5rem 1rem; border-bottom:1px solid var(--border); transition:background 0.12s; }
  .pl-track:last-child { border-bottom:none; }
  .pl-track:hover { background:rgba(255,255,255,0.03); }
  .pl-num { font-size:0.72rem; color:var(--muted2); text-align:right; font-variant-numeric:tabular-nums; }
  .pl-info { min-width:0; }
  .pl-name { font-size:0.82rem; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-artist { font-size:0.74rem; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-link { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; background:var(--green-dim); border:1px solid rgba(29,185,84,0.2); color:var(--green); text-decoration:none; transition:all 0.15s; flex-shrink:0; }
  .pl-link:hover { background:var(--green); color:#000; transform:scale(1.1); }
  .pl-link svg { width:12px; height:12px; }

  /* SHOW MORE */
  .show-more-btn { width:100%; padding:0.6rem; background:transparent; border:none; border-top:1px solid var(--border); color:var(--muted); font-size:0.78rem; cursor:pointer; transition:color 0.15s; }
  .show-more-btn:hover { color:var(--green); }

  /* TYPING */
  .typing-dots { display:flex; gap:4px; padding:4px 0; }
  .typing-dots span { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:dot 1.2s ease-in-out infinite; }
  .typing-dots span:nth-child(2){animation-delay:0.2s}.typing-dots span:nth-child(3){animation-delay:0.4s}
  @keyframes dot{0%,80%,100%{transform:scale(0.7);opacity:0.4}40%{transform:scale(1);opacity:1}}

  /* SUGGESTIONS */
  .suggestions { display:flex; flex-wrap:wrap; gap:6px; }
  .sug-btn { font-size:0.78rem; padding:0.4rem 0.9rem; background:var(--surface); border:1px solid var(--border); border-radius:999px; color:var(--muted); cursor:pointer; transition:all 0.18s; white-space:nowrap; }
  .sug-btn:hover { border-color:var(--green); color:var(--green); background:var(--green-dim); }

  /* INPUT BAR */
  .input-bar { display:flex; gap:8px; align-items:flex-end; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:0.65rem 0.75rem; transition:border-color 0.2s; }
  .input-bar:focus-within { border-color:var(--green); }
  .input-bar textarea { flex:1; background:transparent; border:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.9rem; resize:none; min-height:22px; max-height:140px; line-height:1.5; outline:none; padding:0; }
  .input-bar textarea::placeholder { color:var(--muted2); }
  .send-btn { width:36px; height:36px; border-radius:50%; background:var(--green); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
  .send-btn:hover { background:#1ed760; transform:scale(1.06); }
  .send-btn:disabled { opacity:0.3; cursor:not-allowed; transform:none; }
  .send-btn svg { width:15px; height:15px; }

  /* TOAST */
  .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface2); border:1px solid var(--border2); border-radius:999px; padding:0.6rem 1.2rem; font-size:0.83rem; color:var(--text); transition:transform 0.3s ease; z-index:100; white-space:nowrap; pointer-events:none; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.success { border-color:var(--green); color:var(--green); }

  @media(max-width:480px) {
    .app-body { padding:1rem; }
    .msg-bubble { max-width:90%; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-logo">Playlist<span>AI</span></div>
  <div class="header-badge">✦ powered by Claude</div>
</header>

<div class="app-body">
  <div class="chat-area" id="chat-area"></div>

  <div class="suggestions" id="suggestions">
    <button class="sug-btn" onclick="useSuggestion(this)">MPB anos 70 com Djavan e Gil</button>
    <button class="sug-btn" onclick="useSuggestion(this)">Forró pé de serra clássico</button>
    <button class="sug-btn" onclick="useSuggestion(this)">Soul brasileiro dos anos 70</button>
    <button class="sug-btn" onclick="useSuggestion(this)">Tropicalismo essencial</button>
    <button class="sug-btn" onclick="useSuggestion(this)">Jazz brasileiro relaxante</button>
    <button class="sug-btn" onclick="useSuggestion(this)">Rock nacional anos 90</button>
  </div>

  <div class="input-bar">
    <textarea id="user-input" placeholder="Descreva sua playlist... ex: pagode dos anos 90 pra churrasco" rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let isThinking = false;
const PREVIEW_COUNT = 6;

// ── Spotify URL helpers ──
function spotifySearchUrl(name, artist) {
  return 'https://open.spotify.com/search/' + encodeURIComponent(name + ' ' + artist);
}

function spotifyCreatePlaylistUrl() {
  return 'https://open.spotify.com/';
}

// ── Chat ──
function addAgentMsg(text, playlist) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.innerHTML = '<div class="msg-avatar">AI</div><div class="msg-bubble">' + text + (playlist ? buildCard(playlist) : '') + '</div>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addUserMsg(text) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = '<div class="msg-avatar">Eu</div><div class="msg-bubble">' + text + '</div>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  document.getElementById('suggestions').style.display = 'none';
}

function showTyping() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg agent'; div.id = 'typing';
  div.innerHTML = '<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}
function hideTyping() { document.getElementById('typing')?.remove(); }

// ── Build playlist card ──
function buildCard(pl) {
  const tracks = pl.tracks;
  const preview = tracks.slice(0, PREVIEW_COUNT);
  const rest = tracks.slice(PREVIEW_COUNT);
  const cardId = 'pc-' + pl.id;

  const trackRows = (list) => list.map((t, i) => {
    const idx = tracks.indexOf(t) + 1;
    const url = spotifySearchUrl(t.name, t.artist);
    return '<div class="pl-track">' +
      '<span class="pl-num">' + idx + '</span>' +
      '<div class="pl-info"><div class="pl-name">' + esc(t.name) + '</div><div class="pl-artist">' + esc(t.artist) + '</div></div>' +
      '<a class="pl-link" href="' + url + '" target="_blank" title="Abrir no Spotify" aria-label="Abrir ' + esc(t.name) + ' no Spotify">' +
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>' +
      '</a>' +
    '</div>';
  }).join('');

  const showMoreHtml = rest.length > 0
    ? '<button class="show-more-btn" onclick="expandCard(\'' + cardId + '\')" id="more-' + cardId + '">▾ Ver mais ' + rest.length + ' músicas</button>'
    : '';

  const hiddenRows = rest.length > 0
    ? '<div id="rest-' + cardId + '" style="display:none">' + trackRows(rest) + '</div>'
    : '';

  return '<div class="playlist-card" id="' + cardId + '">' +
    '<div class="playlist-card-header">' +
      '<div class="playlist-card-top">' +
        '<span class="playlist-card-title">' + esc(pl.name) + '</span>' +
        '<span class="track-count-badge">' + tracks.length + ' músicas</span>' +
      '</div>' +
      '<div class="playlist-actions">' +
        '<a class="btn-sp btn-sp-primary" href="https://open.spotify.com/search/' + encodeURIComponent(pl.name) + '" target="_blank">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>' +
          'Abrir Spotify' +
        '</a>' +
        '<a class="btn-sp btn-sp-ghost" href="https://open.spotify.com/" target="_blank">' +
          '+ Criar playlist' +
        '</a>' +
      '</div>' +
    '</div>' +
    '<div class="playlist-track-list">' + trackRows(preview) + '</div>' +
    hiddenRows +
    showMoreHtml +
  '</div>';
}

function expandCard(cardId) {
  const rest = document.getElementById('rest-' + cardId);
  const btn = document.getElementById('more-' + cardId);
  const list = document.querySelector('#' + cardId + ' .playlist-track-list');
  if (rest && list) {
    list.innerHTML += rest.innerHTML;
    rest.remove();
    btn?.remove();
  }
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Claude API ──
async function sendMessage() {
  if (isThinking) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  addUserMsg(text);
  input.value = ''; input.style.height = 'auto';
  isThinking = true;
  document.getElementById('send-btn').disabled = true;
  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        system: `Você é um especialista em música. Responda SOMENTE com JSON válido, sem texto extra, sem markdown, sem backticks. Formato exato:
{"id":"pl_XXXX","name":"<nome criativo em português>","message":"<1-2 frases animadas e curtas sobre a playlist>","tracks":[{"name":"<título exato da música>","artist":"<nome exato do artista>"}]}
Gere entre 15 e 25 músicas reais que existam no Spotify. Use nomes exatos de músicas e artistas para facilitar a busca. O id deve ter 4 caracteres aleatórios após pl_.`,
        messages: [{ role: 'user', content: text }]
      })
    });

    const data = await res.json();
    const raw = (data.content?.[0]?.text || '{}').replace(/```json|```/g, '').trim();
    let pl;
    try { pl = JSON.parse(raw); } catch { throw new Error('parse'); }

    hideTyping();
    addAgentMsg(pl.message, pl);

  } catch {
    hideTyping();
    addAgentMsg('Ops, algo deu errado. Tente novamente com outra descrição!');
  }

  isThinking = false;
  document.getElementById('send-btn').disabled = false;
}

// ── Utils ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}
function useSuggestion(btn) {
  document.getElementById('user-input').value = btn.textContent;
  sendMessage();
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type||'') + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Boot ──
addAgentMsg('Olá! 🎵 Me descreva a playlist dos seus sonhos — gênero, época, clima, artistas favoritos — e eu monto a lista pra você explorar no Spotify!');
</script>
</body>
</html>
